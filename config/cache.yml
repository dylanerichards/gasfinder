default: &default
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies
    # max_age: <%= 60.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

production:
  # Cache store is :memory_store in production (see production.rb), so Solid
  # Cache uses the primary connection and needs no separate database.
  <<: *default
