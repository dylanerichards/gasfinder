# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3


# Production: a single PostgreSQL database, driven by DATABASE_URL (Heroku's
# Postgres add-on sets this automatically). SQLite is not used in production
# because Heroku's filesystem is ephemeral. Cache/queue/cable use in-process
# adapters in production (see config/environments/production.rb and
# config/cable.yml), so no extra databases are needed.
production:
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  database: storage/production.sqlite3
